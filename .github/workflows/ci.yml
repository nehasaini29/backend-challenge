name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: vehicles
          POSTGRES_PASSWORD: vehicles
          POSTGRES_DB: vehicles_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicles -d vehicles_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vehicles:vehicles@localhost:5432/vehicles_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t vehicle-catalog:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-and-build
          path: |
            coverage/
            dist/
          retention-days: 14
